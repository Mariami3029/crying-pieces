<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unsaid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0a0c;color:#f4efe9;font-family:'Courier Prime',ui-monospace,monospace;overflow:hidden}
  *{box-sizing:border-box}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
  #intro{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#0b0a0c;z-index:5;overflow:auto}
  .card{width:min(540px,100%)}
  h1{font-weight:400;font-size:30px;margin:0 0 8px;letter-spacing:.01em}
  p{opacity:.72;margin:0 0 18px;font-size:15px;line-height:1.5}
  textarea{width:100%;min-height:170px;background:#16141a;color:#f4efe9;border:1px solid #34303a;border-radius:14px;padding:14px;font:16px/1.55 'Courier Prime',monospace;resize:vertical}
  textarea:focus{outline:2px solid #f4efe9;outline-offset:2px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
  button{font:inherit;font-size:15px;background:#f4efe9;color:#0b0a0c;border:0;border-radius:999px;padding:11px 20px;min-height:44px;cursor:pointer}
  button.ghost{background:rgba(18,16,20,.55);color:#f4efe9;border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  button:focus-visible{outline:2px solid #f4efe9;outline-offset:3px}
  #rec.on{background:#e5484d;color:#fff;border-color:#e5484d}
  #bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:8px;z-index:4;flex-wrap:wrap;padding:0 12px}
  #hint{position:fixed;top:calc(18px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:14px;z-index:4;transition:opacity 1.2s;pointer-events:none;text-shadow:0 1px 6px #000}
  .small{font-size:13px;opacity:.55;margin-top:14px}
  #err{color:#ff9b9b;font-size:14px;margin-top:12px;min-height:1em}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>

<div id="intro">
  <div class="card">
    <h1>Unsaid</h1>
    <p>Write the things you didn't say. When you open your mouth, they fall out as letters instead of words, and they pile up.</p>
    <textarea id="txt" placeholder="write it here…" aria-label="Your words"></textarea>
    <div class="row">
      <button id="go">Start camera</button>
      <span class="small">Your words stay on this device.</span>
    </div>
    <div id="err" role="alert"></div>
  </div>
</div>

<div id="hint">open your mouth</div>
<div id="bar">
  <button class="ghost" id="edit">Words</button>
  <button class="ghost" id="clear">Clear pile</button>
  <button class="ghost" id="cap">Caption on</button>
  <button class="ghost" id="rec">● Record</button>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
{
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), video = $('v'), txt = $('txt');
const pileCv = document.createElement('canvas'), pctx = pileCv.getContext('2d');
const FONT = "'Courier Prime', monospace";
const COL = 7;              // pile column width (px)
const GRAV = 520;           // px/s²

let W = 0, H = 0, DPR = 1, heights = new Float32Array(1);
let landmarker = null, running = false, lastVT = -1;
let mouth = null, jaw = 0, faceSeen = false;
let falling = [], acc = 0, idx = 0, sentences = [], text = '';
let lastSpill = -1e9, showCaption = true, hintGone = false;
let rec = null, chunks = [];

try { txt.value = localStorage.getItem('unsaid-text') || ''; } catch (e) {}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  pileCv.width = W * DPR; pileCv.height = H * DPR;
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  heights = new Float32Array(Math.ceil(W / COL) + 2);
}
resize();
addEventListener('resize', resize);

function prepText() {
  text = txt.value.replace(/\r/g, '').trim();
  if (!text) text = "I never said it.";
  try { localStorage.setItem('unsaid-text', txt.value); } catch (e) {}
  // sentence boundaries for the caption
  sentences = [];
  const re = /[^.!?\n]+[.!?]*/g; let m;
  while ((m = re.exec(text))) sentences.push({ start: m.index, end: m.index + m[0].length, s: m[0].trim() });
  if (idx >= text.length) idx = 0;
}

async function start() {
  $('err').textContent = '';
  prepText();
  $('go').disabled = true; $('go').textContent = 'Waking the camera…';
  try {
    if (!video.srcObject) {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      video.srcObject = stream;
      await video.play();
    }
    if (!landmarker) {
      $('go').textContent = 'Loading face tracking…';
      const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      landmarker = await FaceLandmarker.createFromOptions(files, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true
      });
    }
    $('intro').style.display = 'none';
    $('bar').style.display = 'flex';
    if (!running) { running = true; requestAnimationFrame(loop); }
  } catch (e) {
    $('err').textContent = (e && e.name === 'NotAllowedError') ? 'Camera permission was blocked. Allow it in your browser settings and try again.' : 'Could not start: ' + (e && e.message || e);
  } finally {
    $('go').disabled = false; $('go').textContent = 'Start camera';
  }
}

function videoRect() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s;
  return { ox: (W - dw) / 2, oy: (H - dh) / 2, dw, dh };
}

function track(now) {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVT) return;
  lastVT = video.currentTime;
  const r = landmarker.detectForVideo(video, now);
  const lm = r.faceLandmarks && r.faceLandmarks[0];
  if (!lm) { faceSeen = false; jaw = 0; return; }
  faceSeen = true;
  const R = videoRect();
  const toScreen = p => ({ x: W - (R.ox + p.x * R.dw), y: R.oy + p.y * R.dh });
  const up = toScreen(lm[13]), lo = toScreen(lm[14]);
  const m = { x: (up.x + lo.x) / 2, y: (up.y + lo.y) / 2, gap: Math.hypot(up.x - lo.x, up.y - lo.y) };
  mouth = mouth ? { x: mouth.x * 0.5 + m.x * 0.5, y: mouth.y * 0.5 + m.y * 0.5, gap: m.gap } : m;
  let j = 0;
  const bs = r.faceBlendshapes && r.faceBlendshapes[0];
  if (bs) { const c = bs.categories.find(c => c.categoryName === 'jawOpen'); if (c) j = c.score; }
  jaw = jaw * 0.6 + j * 0.4;
}

function spawn() {
  // skip whitespace but keep the rhythm of words
  let guard = 0;
  while (/\s/.test(text[idx] || '') && guard++ < 50) { idx++; acc -= 0.6; }
  if (idx >= text.length) { idx = 0; acc = -6; return; }   // short pause before it starts again
  const ch = text[idx++];
  const size = 14 + Math.random() * 8;
  const spread = Math.max(6, (mouth.gap || 10) * 0.6);
  falling.push({
    ch, size, x: mouth.x + (Math.random() - 0.5) * spread, y: mouth.y + 4,
    vx: (Math.random() - 0.5) * 70, vy: 30 + Math.random() * 60,
    r: (Math.random() - 0.5) * 0.4, vr: (Math.random() - 0.5) * 3, a: 0
  });
  lastSpill = performance.now();
}

function settle(p) {
  const col = Math.max(0, Math.min(heights.length - 1, Math.round(p.x / COL)));
  const y = H - heights[col];
  pctx.save();
  pctx.translate(p.x, y - p.size * 0.15);
  pctx.rotate(p.r);
  pctx.font = `${p.size}px ${FONT}`;
  pctx.textAlign = 'center'; pctx.textBaseline = 'middle';
  pctx.fillStyle = 'rgba(244,239,233,0.88)';
  pctx.fillText(p.ch, 0, 0);
  pctx.restore();
  const h = p.size * 0.42;
  heights[col] += h;
  if (col > 0) heights[col - 1] = Math.max(heights[col - 1], heights[col] - h * 1.6);
  if (col < heights.length - 1) heights[col + 1] = Math.max(heights[col + 1], heights[col] - h * 1.6);
}

function landY(x) {
  const col = Math.max(0, Math.min(heights.length - 1, Math.round(x / COL)));
  return H - heights[col];
}

function currentSentence() {
  const i = Math.max(0, idx - 1);
  return sentences.find(s => i >= s.start && i < s.end) || sentences[0];
}

function wrap(str, maxW) {
  const words = str.split(/\s+/), lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines.slice(0, 3);
}

function drawCaption(now) {
  const age = now - lastSpill;
  if (!showCaption || age > 2600) return;
  const s = currentSentence(); if (!s) return;
  const alpha = Math.min(1, (2600 - age) / 600);
  ctx.font = `13px ${FONT}`;
  const maxW = Math.min(W - 64, 460);
  const lines = wrap(s.s, maxW);
  const lh = 18, padX = 16, padY = 10;
  const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + padX * 2;
  const bh = lines.length * lh + padY * 2;
  const bx = (W - bw) / 2, by = H - bh - Math.max(96, H * 0.16);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(30,28,34,0.55)';
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2 > 22 ? 18 : bh / 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f4efe9'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, by + padY + lh * (i + 0.5)));
  ctx.restore();
}

let prev = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  track(now);

  // background: mirrored camera, slightly darkened
  ctx.fillStyle = '#0b0a0c'; ctx.fillRect(0, 0, W, H);
  if (video.readyState >= 2) {
    const R = videoRect();
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, R.ox, R.oy, R.dw, R.dh);
    ctx.restore();
    ctx.fillStyle = 'rgba(10,8,12,0.18)'; ctx.fillRect(0, 0, W, H);
  }

  // spill while the mouth is open
  const open = faceSeen && mouth ? Math.max(0, (jaw - 0.18) / 0.6) : 0;
  if (open > 0) {
    acc += dt * (6 + 38 * Math.min(1, open));
    while (acc >= 1) { acc -= 1; spawn(); }
    if (!hintGone) { hintGone = true; $('hint').style.opacity = 0; }
  } else if (acc > 0) acc = 0;

  // pile
  ctx.drawImage(pileCv, 0, 0, W, H);

  // falling letters
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(255,255,255,0.55)'; ctx.shadowBlur = 6;
  const keep = [];
  for (const p of falling) {
    p.vy += GRAV * dt; p.vx *= 0.995;
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.a = Math.min(1, p.a + dt * 6);
    if (p.x < 4) { p.x = 4; p.vx *= -0.3; } else if (p.x > W - 4) { p.x = W - 4; p.vx *= -0.3; }
    if (p.y >= landY(p.x) - p.size * 0.2) { settle(p); continue; }
    ctx.save(); ctx.globalAlpha = p.a; ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.font = `${p.size}px ${FONT}`; ctx.fillStyle = '#fbf8f4'; ctx.fillText(p.ch, 0, 0);
    ctx.restore();
    keep.push(p);
  }
  falling = keep;
  ctx.shadowBlur = 0;

  drawCaption(now);
  requestAnimationFrame(loop);
}

function clearPile() {
  pctx.save(); pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, pileCv.width, pileCv.height); pctx.restore();
  heights.fill(0); falling = [];
}

function toggleRec() {
  const btn = $('rec');
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  if (!cv.captureStream || !window.MediaRecorder) { btn.textContent = 'Recording not supported'; return; }
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  const stream = cv.captureStream(30);
  rec = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 8e6 } : {});
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const mt = rec.mimeType || type || 'video/webm';
    const blob = new Blob(chunks, { type: mt });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'unsaid-' + Date.now() + (mt.includes('mp4') ? '.mp4' : '.webm');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    btn.classList.remove('on'); btn.textContent = '● Record';
  };
  rec.start(250);
  btn.classList.add('on'); btn.textContent = '■ Stop';
}

$('go').addEventListener('click', start);
$('edit').addEventListener('click', () => { $('intro').style.display = 'grid'; $('bar').style.display = 'none'; $('go').textContent = 'Back to camera'; });
$('clear').addEventListener('click', clearPile);
$('cap').addEventListener('click', e => { showCaption = !showCaption; e.currentTarget.textContent = showCaption ? 'Caption on' : 'Caption off'; });
$('rec').addEventListener('click', toggleRec);
}
</script>
</body>
</html>
